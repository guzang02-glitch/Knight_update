<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>기사의 여행</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen portrait app. Top bar, knight's speech bubble, square board filling the rest, three pill buttons.
   Single committed daytime-meadow look (pastel + thick plum outlines), same in light and dark hosts. */
:root {
  --ink: #3B2F57;
  --ink-soft: #6E6487;
  --sky: #BFE7FF;
  --mint: #DDF7E8;
  --grass-a: #AEE283;
  --grass-b: #98D56E;
  --pink: #FF7FA8;
  --pink-deep: #EC5A8C;
  --gold: #FFD45C;
  --paper: #FFFFFF;
  --lilac: #E9E4F7;
  --scrim: rgba(59, 47, 87, .45);
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky) 0%, var(--mint) 100%);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  overscroll-behavior: none;            /* no pull-to-refresh / bounce while playing */
  touch-action: manipulation;           /* no double-tap zoom */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
img { -webkit-user-drag: none; }
.cloud {
  position: fixed; z-index: 0; pointer-events: none;
  width: 140px; height: 44px; border-radius: 44px;
  background: var(--paper); opacity: .75;
  animation: drift 60s linear infinite;
}
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--paper); border-radius: 50%; }
.cloud::before { width: 60px; height: 60px; left: 22px; top: -28px; }
.cloud::after { width: 46px; height: 46px; left: 70px; top: -18px; }
.cloud.c1 { top: 9%; left: -160px; }
.cloud.c2 { top: 30%; left: -160px; transform: scale(.7); animation-duration: 85s; animation-delay: -40s; }
.cloud.c3 { top: 70%; left: -160px; transform: scale(.85); animation-duration: 75s; animation-delay: -20s; }
@keyframes drift { to { translate: calc(100vw + 320px) 0; } }

/* Mobile-first portrait column: HUD → knight talk → board (fills width) → thumb-zone action bar */
.app {
  position: relative; z-index: 1;
  height: 100%; max-width: 480px; margin: 0 auto;
  box-sizing: border-box;
  padding-inline: 16px; padding-block: 10px 8px;
  display: flex; flex-direction: column; gap: 12px;
}

/* top HUD */
.top { display: flex; align-items: center; gap: 10px; }
.stage-btn {
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--gold); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink); padding: 0 12px; min-height: 44px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.stage-btn small { font-size: 12px; opacity: .75; }
.stage-btn .chev { font-size: 12px; margin-left: 2px; }
.stage-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.progress {
  flex: 1; min-width: 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  height: 38px; position: relative; overflow: hidden;
  box-shadow: 0 4px 0 var(--ink);
}
.progress .label img { width: 24px; height: 24px; }
.progress .fill {
  position: absolute; inset: 0 auto 0 0; width: 0%;
  background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, #FF94B7 10px 20px);
  transition: width .3s ease;
}
.progress .label {
  position: relative; height: 100%;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums;
}

/* knight talk: portrait + speech bubble */
.talk { display: flex; align-items: center; gap: 10px; }
.avatar {
  flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
  background: var(--lilac); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.avatar img { width: 100%; height: 160%; object-fit: cover; object-position: 50% 0; display: block; }
.bubble {
  position: relative; flex: 1; min-width: 0; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 16px;
  padding: 8px 12px; min-height: 56px; box-sizing: border-box;
  display: flex; align-items: center;
  font-size: 15px; line-height: 1.35;
}
.bubble::after {
  content: ""; position: absolute; left: -10px; top: 50%; width: 14px; height: 14px;
  background: var(--paper); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: translateY(-50%) rotate(45deg);
}
.bubble.pop { animation: bubblePop .25s ease; }
@keyframes bubblePop { 50% { transform: scale(1.03); } }

/* board */
/* board sits low, near the thumbs; spare height opens up as sky above it */
.stage-area { flex: 1; min-height: 0; display: grid; place-items: end center; padding-bottom: 6px; }
.board-frame {
  border: 4px solid var(--ink); border-radius: 18px; background: var(--grass-b);
  box-shadow: 0 6px 0 var(--ink);
}
.board { position: relative; cursor: pointer; touch-action: manipulation; }
.g, .ct { position: absolute; left: calc(var(--x) * var(--c)); top: calc(var(--y) * var(--c)); width: var(--c); height: var(--c); }
.g.a { background: var(--grass-a); }
.g.b { background: var(--grass-b); }
/* round only the corner tiles so the knight can overhang the board edge */
.g.tl { border-top-left-radius: 14px; } .g.tr { border-top-right-radius: 14px; }
.g.bl { border-bottom-left-radius: 14px; } .g.br { border-bottom-right-radius: 14px; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trail polyline { fill: none; stroke: var(--paper); stroke-width: .07; stroke-dasharray: .1 .14; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.ct { display: grid; place-items: center; pointer-events: none; }
.ct > *, .ct::after { grid-area: 1 / 1; }
.ct img { width: 86%; height: 86%; object-fit: contain; user-select: none; }
.ct .goal { width: 96%; height: 96%; animation: goalBob 1.4s ease-in-out infinite; }
@keyframes goalBob { 50% { transform: translateY(-4%); } }
.ct .flower {
  width: 84%; height: 84%; position: relative; display: grid; place-items: center;
  animation: bloom .45s cubic-bezier(.3, 1.6, .5, 1) both;
}
.ct .flower img { width: 100%; height: 100%; }
.ct .flower span {
  position: absolute; font-family: var(--f-display); line-height: 1;
  font-size: calc(var(--c) * .22); color: var(--ink); font-variant-numeric: tabular-nums;
}
@keyframes bloom { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
.ct.mark::after {
  content: ""; width: 36%; height: 36%; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--ink); box-sizing: border-box;
  animation: pulse 1s ease-in-out infinite alternate;
}
.ct.hint::after {
  width: 52%; height: 52%; background: var(--gold);
  box-shadow: 0 0 0 6px rgba(255, 212, 92, .45);
  animation: hintPulse .6s ease-in-out infinite alternate;
}
@keyframes pulse { from { transform: scale(.8); opacity: .75; } to { transform: scale(1); opacity: 1; } }
@keyframes hintPulse { from { transform: scale(.85) rotate(0); } to { transform: scale(1.1) rotate(20deg); } }
.ct.shake { animation: shake .3s ease; }
@keyframes shake { 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }

/* knight */
#knight { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; will-change: transform; }
.kflip { width: 100%; height: 100%; transform: scaleX(var(--face, 1)); transition: transform .15s; }
.kbob { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite; }
.ksq { position: relative; width: 100%; height: 100%; transform-origin: 50% 95%; }
.ksq img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: 50% 100%;
  filter: drop-shadow(0 2px 0 rgba(59, 47, 87, .25));
}
.kshadow { position: absolute; left: 24%; right: 24%; bottom: -3%; height: 9%; border-radius: 50%; background: rgba(59, 47, 87, .22); }
@keyframes bob { 50% { transform: translateY(-3%); } }
.mood { display: none; }
[data-mood="normal"] .m-normal, [data-mood="jump"] .m-jump,
[data-mood="sad"] .m-sad, [data-mood="happy"] .m-happy { display: block; }

/* thumb-zone action bar: big round icon buttons, hint in the middle */
.controls {
  display: flex; justify-content: space-evenly; align-items: flex-end;
  padding-top: 2px;
}
.act {
  position: relative; background: none; border: 0; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px;
  font-family: var(--f-display); font-size: 14px; color: var(--ink);
}
.act img { width: 64px; height: 64px; filter: drop-shadow(0 4px 0 rgba(59, 47, 87, .35)); transition: transform .08s; }
.act.main img { width: 80px; height: 80px; }
.act:active img { transform: translateY(3px) scale(.94); }
.act[aria-disabled="true"] { opacity: .4; }
.act.nudge img { animation: nudge .7s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-6px) scale(1.08); } }
.act .count {
  position: absolute; top: 0; right: 4px;
  font-size: 14px; background: var(--pink-deep); color: var(--paper);
  border: 3px solid var(--paper); border-radius: 999px; min-width: 28px; height: 28px; box-sizing: border-box;
  display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink);
}
/* popup buttons */
.btn {
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink); padding: 10px 6px; min-height: 52px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); color: var(--paper); }
button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: grid; place-items: center; padding: 16px;
}
.card {
  width: min(380px, 100%); box-sizing: border-box;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--ink); padding: 20px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  animation: cardIn .4s cubic-bezier(.3, 1.5, .5, 1);
}
@keyframes cardIn { from { transform: scale(.6); opacity: 0; } }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.card .art { width: 120px; height: 170px; animation: cheer .8s ease-in-out infinite alternate; }
.card .art img { width: 100%; height: 100%; object-fit: contain; }
@keyframes cheer { to { transform: translateY(-8px) rotate(3deg); } }
.stats { display: flex; gap: 8px; }
.stats span {
  font-family: var(--f-display); font-size: 14px; background: var(--lilac);
  border-radius: 10px; padding: 4px 10px; font-variant-numeric: tabular-nums;
}
.card .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
/* stage select as a bottom sheet */
.overlay.sheet { place-items: end center; padding: 0; }
.overlay.sheet .card {
  width: 100%; max-width: 480px; border-radius: 26px 26px 0 0; border-bottom: 0; box-shadow: none;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: sheetIn .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes sheetIn { from { transform: translateY(100%); } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--lilac); }
.stage-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%;
  max-height: 56vh; overflow-y: auto; padding: 4px 4px 8px; box-sizing: border-box;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.stage-grid button {
  aspect-ratio: 1; max-width: 100%;
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--lilac); border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 0 3px 0 var(--ink); cursor: pointer; position: relative; padding: 0;
}
.stage-grid button.done { background: var(--pink); color: var(--paper); }
.stage-grid button.cur { background: var(--gold); color: var(--ink); }
.stage-grid button small { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 10px; opacity: .8; }
.legend { font-size: 13px; color: var(--ink-soft); }
.stage-grid button .tag {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  font-style: normal; font-size: 10px; line-height: 1; white-space: nowrap;
  padding: 3px 5px; border-radius: 6px; border: 2px solid var(--ink);
}
.stage-grid button.hurdle .tag { background: var(--pink-deep); color: var(--paper); }
.stage-grid button.long .tag { background: var(--gold); color: var(--ink); }
.stage-grid button.hurdle { border-width: 4px; }
.stage-grid { padding-top: 12px; row-gap: 14px; }

.petal {
  position: fixed; top: -20px; z-index: 30; width: 12px; height: 10px; pointer-events: none;
  border-radius: 70% 0 70% 0;
  animation: fall var(--d) linear forwards;
}
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }

@media (max-height: 680px) {
  .app { gap: 8px; }
  .avatar { width: 46px; height: 46px; }
  .bubble { font-size: 14px; min-height: 46px; padding-block: 5px; }
  .act img { width: 52px; height: 52px; }
  .act.main img { width: 64px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<div class="app">
  <header class="top">
    <button class="stage-btn" id="stageBtn" type="button" data-str-aria="STR_UI_SELECT_STAGE">
      <span id="stageLabel">STAGE 1</span><small id="sizeLabel">4×4</small><span class="chev" aria-hidden="true">▼</span>
    </button>
    <div class="progress" aria-live="polite">
      <div class="fill" id="progFill"></div>
      <div class="label"><img src="img/flower.png" alt=""><span id="progText">1 / 6</span></div>
    </div>
  </header>

  <div class="talk">
    <div class="avatar"><img id="avatar" src="img/knight_normal.png" alt=""></div>
    <div class="bubble" id="bubble"><span id="bubbleText"></span></div>
  </div>

  <main class="stage-area" id="area">
    <div class="board-frame"><div class="board" id="board"></div></div>
  </main>

  <footer class="controls">
    <button class="act" id="undoBtn" type="button"><img src="img/ui_undo.png" alt=""><span data-str="STR_UI_UNDO"></span></button>
    <button class="act main" id="hintBtn" type="button"><img src="img/ui_hint.png" alt=""><span data-str="STR_UI_HINT"></span><span class="count" id="hintCount">3</span></button>
    <button class="act" id="restartBtn" type="button"><img src="img/ui_restart.png" alt=""><span data-str="STR_UI_RESTART"></span></button>
  </footer>
</div>

<div class="overlay" id="clearOverlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
    <div class="art" id="clearArt" data-mood="happy"></div>
    <h2 id="clearTitle"></h2>
    <p id="clearSub"></p>
    <div class="stats"><span id="statUndo"></span><span id="statHint"></span></div>
    <div class="actions">
      <button class="btn pink" id="nextBtn" type="button"></button>
      <button class="btn" id="replayBtn" type="button" data-str="STR_UI_REPLAY"></button>
    </div>
  </div>
</div>

<div class="overlay sheet" id="selectOverlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="selectTitle">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="selectTitle" data-str="STR_UI_SELECT_TITLE"></h2>
    <div class="stage-grid" id="stageGrid"></div>
    <p class="legend" data-str="STR_UI_SELECT_LEGEND"></p>
    <div class="actions"><button class="btn" id="closeSelect" type="button" data-str="STR_UI_CLOSE"></button></div>
  </div>
</div>

<script>
(() => {
  // ---------- strings ----------
  // StringTable: every on-screen text by key. Language = column; a missing column falls back to ko.
  // Named params like {count} keep each language free to order words its own way.
  const LANG_DEFAULT = "ko";
  let LANG = LANG_DEFAULT;
  const STRINGS = {
    // UI
    STR_UI_TITLE:             { ko: "기사의 여행", en: "Knight's Journey", ja: "騎士の旅" },
    STR_UI_STAGE:             { ko: "STAGE {stage}", en: "STAGE {stage}", ja: "STAGE {stage}" },
    STR_UI_SELECT_STAGE:      { ko: "스테이지 고르기", en: "Choose stage", ja: "ステージをえらぶ" },
    STR_UI_UNDO:              { ko: "되돌리기", en: "Undo", ja: "戻す" },
    STR_UI_HINT:              { ko: "힌트", en: "Hint", ja: "ヒント" },
    STR_UI_RESTART:           { ko: "다시하기", en: "Restart", ja: "やり直し" },
    STR_UI_CLEAR_TITLE:       { ko: "스테이지 {stage} 클리어!", en: "Stage {stage} Clear!", ja: "ステージ{stage}クリア！" },
    STR_UI_CLEAR_TITLE_LAST:  { ko: "모든 여행 완료!", en: "Journey Complete!", ja: "すべての旅をクリア！" },
    STR_UI_CLEAR_DESC:        { ko: "{count}칸을 모두 꽃으로 덮고 성에 도착했어요.", en: "You covered all {count} tiles with flowers and reached the castle.", ja: "{count}マスを花でうめて、お城に着きました。" },
    STR_UI_CLEAR_DESC_LAST:   { ko: "{count}칸 기사의 여행을 해냈어요. 진짜 기사님이에요!", en: "You finished a {count}-tile knight's tour. A true knight!", ja: "{count}マスの騎士の旅を達成！本物の騎士です！" },
    STR_UI_STAT_UNDO:         { ko: "되돌리기 {count}회", en: "Undo ×{count}", ja: "戻す {count}回" },
    STR_UI_STAT_HINT:         { ko: "힌트 {count}회", en: "Hint ×{count}", ja: "ヒント {count}回" },
    STR_UI_NEXT:              { ko: "다음 스테이지", en: "Next stage", ja: "次のステージ" },
    STR_UI_REPLAY:            { ko: "한 번 더 하기", en: "Play again", ja: "もう一回" },
    STR_UI_SELECT_TITLE:      { ko: "어디로 여행할까?", en: "Where to next?", ja: "どこへ旅する？" },
    STR_UI_SELECT_LEGEND:     { ko: "관문 = 갈림길 많음 · 먼 길 = 칸 많음", en: "Gate = many branches · Long road = many tiles", ja: "関門 = 分かれ道が多い · 遠い道 = マスが多い" },
    STR_UI_CLOSE:             { ko: "닫기", en: "Close", ja: "閉じる" },
    STR_UI_TAG_HURDLE:        { ko: "관문", en: "Gate", ja: "関門" },
    STR_UI_TAG_LONG:          { ko: "먼 길", en: "Long", ja: "遠い道" },
    STR_UI_STAGE_ARIA:        { ko: "스테이지 {stage}, {size}", en: "Stage {stage}, {size}", ja: "ステージ{stage}、{size}" },
    STR_UI_ARIA_CLEARED:      { ko: "클리어", en: "cleared", ja: "クリア済み" },
    STR_UI_ARIA_SEP:          { ko: ", ", en: ", ", ja: "、" },
    // dialogue (knight speech bubble)
    STR_DLG_STAGE_START_FIRST:  { ko: "빛나는 칸을 눌러 L자로 폴짝! 풀밭을 전부 밟고 깃발 성에서 끝내 줘.", en: "Tap a glowing tile to hop in an L! Step on every patch of grass and finish at the flag castle.", ja: "光るマスをタップしてL字にジャンプ！草地を全部踏んで旗のお城でゴールしてね。" },
    STR_DLG_STAGE_START:        { ko: "풀밭 {count}칸을 전부 밟고 깃발 성에 도착하자!", en: "Step on all {count} tiles and reach the flag castle!", ja: "{count}マス全部踏んで旗のお城へ行こう！" },
    STR_DLG_STAGE_START_HURDLE: { ko: "관문 스테이지! 갈림길이 많아. {count}칸을 신중하게 밟자!", en: "Gate stage! Lots of branches. Take all {count} tiles carefully!", ja: "関門ステージ！分かれ道が多いよ。{count}マスを慎重に進もう！" },
    STR_DLG_STAGE_START_LONG:   { ko: "먼 여행길이야! 길은 좁지만 {count}칸이나 돼.", en: "A long road! The path is narrow, but it's {count} tiles long.", ja: "遠い旅路だよ！道はせまいけど{count}マスもあるよ。" },
    STR_DLG_MOVE:               { ko: "좋아! 남은 풀밭 {count}칸.", en: "Nice! {count} tiles left.", ja: "いいね！残り{count}マス。" },
    STR_DLG_MOVE_NEAR_END:      { ko: "거의 다 왔어! {count}칸만 더!", en: "Almost there! Just {count} more!", ja: "あと少し！あと{count}マス！" },
    STR_DLG_UNDO:               { ko: "한 칸 뒤로! 남은 풀밭 {count}칸.", en: "One step back! {count} tiles left.", ja: "一歩もどったよ！残り{count}マス。" },
    STR_DLG_TAP_ROCK:           { ko: "바위는 밟을 수 없어!", en: "You can't step on rocks!", ja: "岩は踏めないよ！" },
    STR_DLG_TAP_FLOWER:         { ko: "거긴 벌써 꽃이 피었어.", en: "Flowers already bloom there.", ja: "そこはもう花が咲いてるよ。" },
    STR_DLG_TAP_CASTLE_EARLY:   { ko: "깃발 성은 마지막에! 다른 풀밭을 먼저 다 밟아 줘.", en: "The castle comes last! Step on all the other grass first.", ja: "お城は最後！ほかの草地を先に全部踏んでね。" },
    STR_DLG_TAP_INVALID:        { ko: "거긴 L자로 갈 수 없어. 빛나는 칸을 눌러 줘!", en: "That's not an L-jump away. Tap a glowing tile!", ja: "そこへはL字で行けないよ。光るマスをタップしてね！" },
    STR_DLG_STUCK:              { ko: "으앙, 더 갈 곳이 없어… 아직 {count}칸 남았는데. 되돌리기나 힌트를 눌러 줘!", en: "Oh no, nowhere to go… {count} tiles still left. Try Undo or Hint!", ja: "うわぁ、もう行けない…まだ{count}マス残ってるのに。戻すかヒントを押してね！" },
    STR_DLG_HINT:               { ko: "반짝이는 별 칸으로 가 봐!", en: "Try the sparkling star tile!", ja: "キラキラの星のマスへ行ってみて！" },
    STR_DLG_HINT_REWIND:        { ko: "그 길로는 성까지 못 가. {count}칸 되돌아왔어! 여기서 반짝이는 별 칸으로 가 봐.", en: "That way can't reach the castle. I went back {count} tiles! Try the star tile from here.", ja: "その道じゃお城に行けないよ。{count}マス戻ったよ！ここから星のマスへ行ってみて。" },
    STR_DLG_HINT_EMPTY:         { ko: "힌트를 다 썼어. 다시하기로 새로 시작해도 괜찮아!", en: "No hints left. It's okay to start over with Restart!", ja: "ヒントを使い切ったよ。やり直しで最初からでも大丈夫！" },
    STR_DLG_CLEAR:              { ko: "성에 도착! 들판이 온통 꽃밭이야!", en: "Made it to the castle! The whole field is in bloom!", ja: "お城に到着！野原が一面お花畑だ！" },
  };
  function t(key, params = {}) {
    const row = STRINGS[key];
    if (!row) return key;
    const s = row[LANG] ?? row[LANG_DEFAULT];
    return s.replace(/\{(\w+)\}/g, (m, k) => (k in params ? params[k] : m));
  }
  // fill static markup: data-str → text, data-str-aria → aria-label
  function applyStaticText() {
    document.documentElement.lang = LANG;
    document.title = t("STR_UI_TITLE");
    document.querySelectorAll("[data-str]").forEach(el => { el.textContent = t(el.dataset.str); });
    document.querySelectorAll("[data-str-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.strAria)); });
  }

  // ---------- art ----------
  // Illustrations generated with Codex image generation (img/*.png, trimmed to 320px).
  const IMG = name => `img/${name}.png`;
  const KNIGHT_ART = ["normal", "jump", "sad", "happy"]
    .map(m => `<img class="mood m-${m}" src="${IMG("knight_" + m)}" alt="" draggable="false">`).join("");
  const flowerArt = n => `<div class="flower"><img src="${IMG("flower")}" alt="" draggable="false"><span>${n}</span></div>`;
  const GOAL_ART = `<img class="goal" src="${IMG("castle")}" alt="" draggable="false">`;
  const ROCK_ART = `<img class="rock" src="${IMG("rock")}" alt="" draggable="false">`;

  // ---------- levels ----------
  // StageTable: [board size, cells to step on (LEN), map seed, type]
  // Board grows every 10 stages (4x4 → 8x8). Type: N normal, H hurdle (x5/x0: most move sequences in its band),
  // L long (x3/x8: longer LEN, fewer move sequences than its neighbours). Seeds picked by the level design tool.
  const STAGES = [
    [4, 6, 109407, 'N'], [4, 8, 1584758, 'N'], [4, 10, 232940264, 'L'], [4, 9, 9141697, 'N'], [4, 11, 250237000, 'H'],
    [4, 10, 14499327, 'N'], [4, 11, 6024810, 'N'], [4, 12, 192136775, 'L'], [4, 11, 29499944, 'N'], [4, 13, 277716819, 'H'],
    [5, 11, 6056486, 'N'], [5, 13, 10150062, 'N'], [5, 14, 16442334, 'L'], [5, 13, 11841564, 'N'], [5, 16, 9023639, 'H'],
    [5, 14, 7564126, 'N'], [5, 15, 6525368, 'N'], [5, 17, 5906139, 'L'], [5, 16, 4656697, 'N'], [5, 17, 22888075, 'H'],
    [6, 17, 6244083, 'N'], [6, 19, 15259922, 'N'], [6, 21, 43545897, 'L'], [6, 19, 22292603, 'N'], [6, 21, 30680068, 'H'],
    [6, 20, 5342956, 'N'], [6, 21, 33104673, 'N'], [6, 24, 114279406, 'L'], [6, 22, 10394931, 'N'], [6, 23, 32815469, 'H'],
    [7, 25, 14497039, 'N'], [7, 26, 10944785, 'N'], [7, 29, 76829084, 'L'], [7, 27, 14417293, 'N'], [7, 30, 74960413, 'H'],
    [7, 29, 76329196, 'N'], [7, 30, 70368175, 'N'], [7, 32, 258156417, 'L'], [7, 30, 29434974, 'N'], [7, 31, 122757045, 'H'],
    [8, 33, 39506635, 'N'], [8, 34, 20978134, 'N'], [8, 36, 37848648, 'L'], [8, 34, 990733, 'N'], [8, 37, 29486779, 'H'],
    [8, 34, 13888238, 'N'], [8, 35, 13896770, 'N'], [8, 40, 190166661, 'L'], [8, 38, 16846859, 'N'], [8, 39, 163790178, 'H'],
  ];
  const MOVES = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

  function rng(seed) {
    return () => {
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Draw a random knight path of the target length (Warnsdorff + noise); every cell off the path becomes a rock.
  function genLevel(i) {
    const [n, len, seed, type] = STAGES[i];
    const full = len === n * n;
    for (let attempt = 0; attempt < 2000; attempt++) {
      const r = rng(seed + attempt * 7);
      const vis = new Array(n * n).fill(false);
      let x = Math.floor(r() * n), y = Math.floor(r() * n);
      const path = [y * n + x];
      vis[y * n + x] = true;
      while (path.length < len) {
        let best = null;
        for (const [dx, dy] of MOVES) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= n || ny >= n || vis[ny * n + nx]) continue;
          let d = 0;
          for (const [ex, ey] of MOVES) {
            const qx = nx + ex, qy = ny + ey;
            if (qx >= 0 && qy >= 0 && qx < n && qy < n && !vis[qy * n + qx]) d++;
          }
          const s = d + r() * (full ? 0.99 : 2.5);
          if (!best || s < best.s) best = { nx, ny, s };
        }
        if (!best) break;
        x = best.nx; y = best.ny;
        vis[y * n + x] = true;
        path.push(y * n + x);
      }
      if (path.length === len) return { n, len, type, start: path[0], goal: path[len - 1], solution: path, rock: vis.map(v => !v) };
    }
    throw new Error("level generation failed: " + i);
  }

  function neighbors(L) {
    const { n } = L, nb = [];
    for (let c = 0; c < n * n; c++) {
      const x = c % n, y = (c / n) | 0, list = [];
      if (!L.rock[c]) for (const [dx, dy] of MOVES) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < n && ny < n && !L.rock[ny * n + nx]) list.push(ny * n + nx);
      }
      nb.push(list);
    }
    return nb;
  }

  // ---------- state ----------
  const KEY = "knight-tour-v6";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} }
  };
  const saved = store.get();
  const cleared = new Set(Array.isArray(saved.cleared) ? saved.cleared : []);
  const persist = () => store.set({ cleared: [...cleared], stage: L.index });

  let L = null, S = null, cellPx = 40;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = id => document.getElementById(id);
  const board = $("board"), area = $("area");
  let cts = [], trail = null, knight = null;

  const cur = () => S.path[S.path.length - 1];
  // the goal castle can only be entered as the very last step
  const options = () => L.nb[cur()].filter(q => !S.vis[q] && (q !== L.goal || L.len - S.path.length === 1));

  function loadStage(i, replay) {
    L = genLevel(i);
    L.index = i;
    L.nb = neighbors(L);
    S = { path: [L.start], vis: new Uint8Array(L.n * L.n), hints: 3, hintsUsed: 0, undos: 0, busy: false, done: false, hintCell: -1 };
    S.vis[L.start] = 1;
    if (Array.isArray(replay) && replay[0] === L.start) {
      for (const c of replay.slice(1)) {
        if (!L.nb[cur()].includes(c) || S.vis[c]) break;
        S.path.push(c); S.vis[c] = 1;
      }
    }
    buildBoard();
    layout();
    render();
    setMood("normal");
    $("stageLabel").textContent = t("STR_UI_STAGE", { stage: i + 1 });
    $("sizeLabel").textContent = `${L.n}×${L.n}`;
    say(i === 0 ? "STR_DLG_STAGE_START_FIRST" :
        L.type === "H" ? "STR_DLG_STAGE_START_HURDLE" :
        L.type === "L" ? "STR_DLG_STAGE_START_LONG" : "STR_DLG_STAGE_START", { count: L.len });
    persist();
    if (S.path.length > 1) afterMove(false);
  }

  function buildBoard() {
    const { n } = L;
    board.innerHTML = "";
    board.style.setProperty("--n", n);
    const frag = document.createDocumentFragment();
    for (let c = 0; c < n * n; c++) {
      const g = document.createElement("div");
      g.className = "g " + (((c % n) + ((c / n) | 0)) % 2 ? "b" : "a") +
        (c === 0 ? " tl" : c === n - 1 ? " tr" : c === n * (n - 1) ? " bl" : c === n * n - 1 ? " br" : "");
      g.style.setProperty("--x", c % n); g.style.setProperty("--y", (c / n) | 0);
      frag.appendChild(g);
    }
    trail = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    trail.setAttribute("class", "trail");
    trail.setAttribute("viewBox", `0 0 ${n} ${n}`);
    trail.setAttribute("preserveAspectRatio", "none");
    trail.innerHTML = "<polyline/>";
    frag.appendChild(trail);
    cts = [];
    for (let c = 0; c < n * n; c++) {
      const ct = document.createElement("div");
      ct.className = "ct";
      ct.style.setProperty("--x", c % n); ct.style.setProperty("--y", (c / n) | 0);
      if (L.rock[c]) ct.innerHTML = ROCK_ART;
      else if (c === L.goal) ct.innerHTML = GOAL_ART;
      cts.push(ct);
      frag.appendChild(ct);
    }
    knight = document.createElement("div");
    knight.id = "knight";
    knight.dataset.mood = "normal";
    knight.innerHTML = `<div class="kflip"><div class="kbob"><div class="ksq"><div class="kshadow"></div>${KNIGHT_ART}</div></div></div>`;
    frag.appendChild(knight);
    board.appendChild(frag);
  }

  function layout() {
    if (!L) return;
    const r = area.getBoundingClientRect();
    const size = Math.max(120, Math.min(r.width, r.height) - 14);
    cellPx = Math.floor(size / L.n);
    board.style.setProperty("--c", cellPx + "px");
    board.style.width = board.style.height = cellPx * L.n + "px";
    const kw = cellPx * 1.3, kh = cellPx * 1.55;
    knight.style.width = kw + "px";
    knight.style.height = kh + "px";
    const p = kpos(cur());
    knight.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }

  function kpos(c) {
    const kw = cellPx * 1.3, kh = cellPx * 1.55;
    return { x: (c % L.n) * cellPx + (cellPx - kw) / 2, y: ((c / L.n) | 0) * cellPx + cellPx * 0.97 - kh };
  }

  function render() {
    const opts = S.done ? [] : options();
    S.path.forEach((c, k) => {
      const ct = cts[c];
      if (ct.dataset.v !== String(k + 1)) { ct.dataset.v = k + 1; ct.innerHTML = flowerArt(k + 1); }
    });
    cts.forEach((ct, c) => {
      if (!S.vis[c] && ct.dataset.v) { delete ct.dataset.v; ct.innerHTML = c === L.goal ? GOAL_ART : ""; }
      ct.classList.toggle("mark", !S.busy && opts.includes(c));
      ct.classList.toggle("hint", !S.busy && c === S.hintCell);
    });
    trail.firstChild.setAttribute("points", S.path.map(c => `${c % L.n + .5},${((c / L.n) | 0) + .5}`).join(" "));
    $("progText").textContent = `${S.path.length} / ${L.len}`;
    $("progFill").style.width = (S.path.length / L.len * 100) + "%";
    $("hintCount").textContent = S.hints;
    $("hintBtn").setAttribute("aria-disabled", S.hints <= 0);
    $("undoBtn").setAttribute("aria-disabled", S.path.length <= 1);
  }

  function setMood(m) {
    if (knight) knight.dataset.mood = m;
    const a = $("avatar"), src = IMG("knight_" + m);
    if (a && a.getAttribute("src") !== src) a.src = src;
  }
  // short haptic ticks on phones that support it (silently ignored elsewhere)
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  let bubbleTimer = 0;
  // the bubble takes a StringTable key; the last key + params are kept so a language change can re-render it
  let lastSay = null;
  function say(key, params) {
    const b = $("bubble");
    lastSay = { key, params };
    $("bubbleText").textContent = t(key, params);
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    clearTimeout(bubbleTimer);
  }

  function hop(from, to, done) {
    const a = kpos(from), b = kpos(to);
    if (b.x !== a.x) knight.querySelector(".kflip").style.setProperty("--face", b.x < a.x ? -1 : 1);
    knight.style.transform = `translate(${b.x}px, ${b.y}px)`;
    if (reduced) { done(); return; }
    const h = cellPx * 0.8, frames = [];
    for (let k = 0; k <= 10; k++) {
      const t = k / 10;
      frames.push({ transform: `translate(${a.x + (b.x - a.x) * t}px, ${a.y + (b.y - a.y) * t - 4 * h * t * (1 - t)}px)` });
    }
    knight.animate(frames, { duration: 320, easing: "linear" });
    // game logic runs on a timer so input never depends on the animation finishing
    setTimeout(() => {
      knight.querySelector(".ksq").animate(
        [{ transform: "scale(1.18, .82)" }, { transform: "scale(.95, 1.05)" }, { transform: "scale(1)" }],
        { duration: 220, easing: "ease-out" });
      done();
    }, 320);
  }

  // ---------- actions ----------
  function tap(c) {
    if (S.busy || S.done) return;
    if (c === cur()) return;
    if (options().includes(c)) return move(c);
    const ct = cts[c];
    ct.classList.remove("shake"); void ct.offsetWidth; ct.classList.add("shake");
    buzz(15);
    say(L.rock[c] ? "STR_DLG_TAP_ROCK" : S.vis[c] ? "STR_DLG_TAP_FLOWER" :
        c === L.goal ? "STR_DLG_TAP_CASTLE_EARLY" : "STR_DLG_TAP_INVALID");
  }

  function move(c) {
    const from = cur();
    S.path.push(c); S.vis[c] = 1; S.hintCell = -1; S.busy = true;
    setMood("jump");
    $("undoBtn").classList.remove("nudge");
    render();
    hop(from, c, () => { S.busy = false; afterMove(true); });
  }

  function afterMove(fromPlay) {
    render();
    const left = L.len - S.path.length;
    if (left === 0) {
      S.done = true; setMood("happy"); render(); buzz([30, 50, 30, 50, 60]);
      say("STR_DLG_CLEAR");
      cleared.add(L.index); persist();
      setTimeout(showClear, reduced ? 0 : 550);
      return;
    }
    if (!options().length) {
      setMood("sad"); buzz([20, 40, 20]);
      say("STR_DLG_STUCK", { count: left });
      $("undoBtn").classList.add("nudge");
      return;
    }
    setMood("normal");
    if (fromPlay) say(left <= 3 ? "STR_DLG_MOVE_NEAR_END" : "STR_DLG_MOVE", { count: left });
  }

  function undo() {
    if (S.busy || S.done || S.path.length <= 1) return;
    const from = S.path.pop();
    S.vis[from] = 0; S.undos++; S.hintCell = -1; S.busy = true;
    $("undoBtn").classList.remove("nudge");
    setMood("jump");
    render();
    hop(from, cur(), () => { S.busy = false; setMood("normal"); render(); say("STR_DLG_UNDO", { count: L.len - S.path.length }); });
  }

  function restart() {
    if (S.busy) return;
    loadStage(L.index);
  }

  // Depth-first search for routes that cover every open cell and end on the goal, continuing `path`.
  // Returns { next, count, nodes }: next = first cell of a found route (-1 none, -2 gave up at `limit` nodes).
  // countUpTo > 0 keeps searching until that many routes are found (used to check uniqueness).
  function search(path, limit, countUpTo = 0) {
    const nb = L.nb, total = L.n * L.n, G = L.goal;
    const vis = new Uint8Array(total);
    for (const c of path) vis[c] = 1;
    let nodes = 0, count = 0;
    const free = q => { let d = 0; for (const r of nb[q]) if (!vis[r]) d++; return d; };
    // The route must end on the goal, so every other open cell needs a way in and a way out,
    // and the goal needs at least a way in.
    const seen = new Uint8Array(total), queue = new Int16Array(total);
    function hopeless(c, rem) {
      if (rem <= 1) return false;
      for (let q = 0; q < total; q++) {
        if (L.rock[q] || vis[q]) continue;
        const d = free(q) + (nb[c].includes(q) ? 1 : 0);
        if (d < (q === G ? 1 : 2)) return true;
      }
      // every open cell must still be reachable from here
      seen.fill(0); seen[c] = 1;
      let head = 0, tail = 0, reached = 0;
      queue[tail++] = c;
      while (head < tail) {
        const p = queue[head++];
        for (const r of nb[p]) if (!vis[r] && !seen[r]) { seen[r] = 1; reached++; queue[tail++] = r; }
      }
      return reached < rem;
    }
    function order(c, rem) {
      return nb[c].filter(q => !vis[q] && (q !== G || rem === 1))
        .map(q => [q, free(q)]).sort((a, b) => a[1] - b[1]).map(p => p[0]);
    }
    // returns true to stop searching
    function dfs(c, rem) {
      if (rem === 0) return ++count >= Math.max(1, countUpTo);
      if (++nodes > limit) throw "timeout";
      if (hopeless(c, rem)) return false;
      for (const q of order(c, rem)) {
        vis[q] = 1;
        const stop = dfs(q, rem - 1);
        vis[q] = 0;
        if (stop) return true;
      }
      return false;
    }
    const c0 = path[path.length - 1], rem0 = L.len - path.length;
    let first = -1;
    try {
      if (rem0 === 0 || hopeless(c0, rem0)) return { next: -1, count, nodes };
      for (const q of order(c0, rem0)) {
        vis[q] = 1;
        const before = count;
        const stop = dfs(q, rem0 - 1);
        vis[q] = 0;
        if (count > before && first < 0) first = q;
        if (stop) break;
      }
      return { next: first, count, nodes };
    } catch (e) { return { next: first >= 0 ? first : -2, count, nodes }; }
  }

  // Find the latest point on the player's path from which a full route still exists.
  // Returns { k, next }: keep the first k cells of the path, then step to `next`.
  // The generator's own route always works, so the shared prefix with it is the fallback.
  function findRewind() {
    const p = S.path;
    let common = 0;
    while (common < p.length && p[common] === L.solution[common]) common++;
    let budget = 400000;
    for (let k = p.length; k > common && budget > 0; k--) {
      const r = search(p.slice(0, k), Math.min(120000, budget));
      budget -= r.nodes;
      if (r.next >= 0) return { k, next: r.next };
    }
    return { k: common, next: L.solution[common] };
  }

  function hint() {
    if (S.busy || S.done) return;
    if (S.hints <= 0) { say("STR_DLG_HINT_EMPTY"); return; }
    const { k, next } = findRewind();
    S.hints--; S.hintsUsed++;
    $("undoBtn").classList.remove("nudge");
    const back = S.path.length - k;
    if (back === 0) {
      S.hintCell = next;
      render();
      say("STR_DLG_HINT");
      return;
    }
    // rewind to the last solvable point, then show the way from there
    const from = cur();
    for (const c of S.path.splice(k)) S.vis[c] = 0;
    S.busy = true;
    setMood("jump");
    render();
    hop(from, cur(), () => {
      S.busy = false;
      S.hintCell = next;
      setMood("normal");
      render();
      say("STR_DLG_HINT_REWIND", { count: back });
    });
  }

  // ---------- overlays ----------
  function showClear() {
    const last = L.index === STAGES.length - 1;
    $("clearTitle").textContent = last ? t("STR_UI_CLEAR_TITLE_LAST") : t("STR_UI_CLEAR_TITLE", { stage: L.index + 1 });
    $("clearSub").textContent = t(last ? "STR_UI_CLEAR_DESC_LAST" : "STR_UI_CLEAR_DESC", { count: L.len });
    $("statUndo").textContent = t("STR_UI_STAT_UNDO", { count: S.undos });
    $("statHint").textContent = t("STR_UI_STAT_HINT", { count: S.hintsUsed });
    $("nextBtn").textContent = t(last ? "STR_UI_SELECT_STAGE" : "STR_UI_NEXT");
    $("clearOverlay").hidden = false;
    $("nextBtn").focus();
    petals();
  }

  function petals() {
    if (reduced) return;
    const colors = ["#FF7FA8", "#FFD45C", "#FFFFFF", "#AEE283", "#FF9FBE"];
    for (let k = 0; k < 46; k++) {
      const p = document.createElement("div");
      p.className = "petal";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[k % colors.length];
      p.style.setProperty("--d", (1.8 + Math.random() * 1.6) + "s");
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.animationDelay = Math.random() * .6 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4200);
    }
  }

  function openSelect() {
    const grid = $("stageGrid");
    grid.innerHTML = "";
    STAGES.forEach(([n], i) => {
      const b = document.createElement("button");
      b.type = "button";
      const type = STAGES[i][3];
      b.className = (cleared.has(i) ? "done " : "") + (L && i === L.index ? "cur " : "") + (type === "H" ? "hurdle" : type === "L" ? "long" : "");
      const tag = type === "H" ? t("STR_UI_TAG_HURDLE") : type === "L" ? t("STR_UI_TAG_LONG") : "";
      b.innerHTML = `${i + 1}<small>${n}×${n}</small>` + (tag ? `<i class="tag">${tag}</i>` : "");
      const sep = t("STR_UI_ARIA_SEP");
      b.setAttribute("aria-label", t("STR_UI_STAGE_ARIA", { stage: i + 1, size: `${n}×${n}` }) + (tag ? sep + tag : "") + (cleared.has(i) ? sep + t("STR_UI_ARIA_CLEARED") : ""));
      b.addEventListener("click", () => { $("selectOverlay").hidden = true; loadStage(i); });
      grid.appendChild(b);
    });
    $("selectOverlay").hidden = false;
  }

  // ---------- wiring ----------
  // pointerdown reacts the moment a finger touches the board (no click delay on phones)
  board.addEventListener("pointerdown", e => {
    if (!L || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    const r = board.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / cellPx), y = Math.floor((e.clientY - r.top) / cellPx);
    if (x >= 0 && y >= 0 && x < L.n && y < L.n) tap(y * L.n + x);
  });
  $("undoBtn").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", hint);
  $("restartBtn").addEventListener("click", restart);
  $("stageBtn").addEventListener("click", openSelect);
  $("closeSelect").addEventListener("click", () => { $("selectOverlay").hidden = true; });
  // tapping the dimmed area above the bottom sheet closes it
  $("selectOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $("nextBtn").addEventListener("click", () => {
    $("clearOverlay").hidden = true;
    if (L.index === STAGES.length - 1) openSelect(); else loadStage(L.index + 1);
  });
  $("replayBtn").addEventListener("click", () => { $("clearOverlay").hidden = true; loadStage(L.index); });
  document.addEventListener("keydown", e => {
    if (!$("clearOverlay").hidden || !$("selectOverlay").hidden) {
      if (e.key === "Escape") $("selectOverlay").hidden = true;
      return;
    }
    const k = e.key.toLowerCase();
    if (k === "z" || k === "backspace") undo();
    else if (k === "h") hint();
    else if (k === "r") restart();
  });
  $("clearArt").innerHTML = `<img src="${IMG("knight_happy")}" alt="" draggable="false">`;
  // language switch (no button yet): refresh static markup, bubble, HUD and the stage sheet
  function setLang(lang) {
    LANG = lang;
    applyStaticText();
    if (lastSay) say(lastSay.key, lastSay.params);
    if (L) $("stageLabel").textContent = t("STR_UI_STAGE", { stage: L.index + 1 });
    if (!$("selectOverlay").hidden) openSelect();
  }
  if (location.hash === "#debug") window.__kt = { setLang, search, findRewind, loadStage, state: () => S, level: () => L, stages: STAGES };
  new ResizeObserver(layout).observe(area);

  function boot(d) {
    applyStaticText();
    let st = d && Number.isInteger(d.stage) ? d.stage : saved.stage;
    if (!Number.isInteger(st) || st < 0 || st >= STAGES.length) st = 0;
    loadStage(st, d && d.path);
  }
  try { window.claude?.hot?.snapshot?.(() => ({ stage: L && L.index, path: S && S.path })); } catch {}
  const hot = window.claude?.hot;
  hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
})();
</script>
